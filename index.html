<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#c83e7b"><meta name="description" content="لمسة توفير — ملابس نسائية وبيجامات وملابس داخلية بأسعار مناسبة"><title>لمسة توفير | أناقتك بأسعار توفر لك</title>
<style>
:root{--pink:#c83e7b;--pale:#ffe1ed;--bg:#fff8fb;--ink:#402331;--muted:#805c6d}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,#c83e7b,#e46b9e);color:white;text-align:center;padding:28px 15px}header h1{margin:0 0 8px;font-size:clamp(1.7rem,5vw,2.4rem)}header p{margin:0}.wrap{max-width:1100px;margin:auto;padding:16px}.promo{background:var(--pale);padding:14px;border-radius:14px;text-align:center;margin-bottom:14px;font-weight:bold}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.tools input,.tools select{font:inherit;padding:12px;border:1px solid #efbfd2;border-radius:10px;background:#fff;flex:1;min-width:145px;color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:white;border:1px solid #f4d6e2;border-radius:15px;overflow:hidden;box-shadow:0 4px 15px #8e31500d}.photo,.placeholder{width:100%;height:190px;object-fit:cover;display:grid;place-items:center;background:#fff0f6}.photo{display:block;cursor:zoom-in}.placeholder{font-size:55px}.content{padding:12px}.content h2{font-size:1rem;margin:0 0 8px}.desc{font-size:.88rem;color:var(--muted);line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.price{color:#b82f6d;font-weight:bold;font-size:1.08rem;margin:10px 0}.btn{display:block;width:100%;border:0;background:var(--pink);color:white;text-align:center;text-decoration:none;font:inherit;font-weight:bold;padding:12px;border-radius:10px;cursor:pointer;margin-top:8px}.empty,.status{grid-column:1/-1;text-align:center;padding:25px;background:white;border:1px solid #f4d6e2;border-radius:14px;line-height:1.8}.status{color:var(--muted)}.note{text-align:center;font-size:.8rem;color:#8c6475;margin:18px 0}footer{text-align:center;padding:22px;color:#8c6475}.viewer{display:none;position:fixed;inset:0;background:#160912ed;z-index:5;align-items:center;justify-content:center;padding:15px}.viewer img{max-width:100%;max-height:88vh;object-fit:contain}.viewer button{position:absolute;top:12px;left:12px;width:auto}.topline{max-width:1100px;margin:auto;padding:0 16px 14px;text-align:center}a.adminlink{color:#a13b68;font-size:.85rem}
@media(min-width:650px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.photo,.placeholder{height:260px}}@media(max-width:360px){.grid{grid-template-columns:1fr}.photo,.placeholder{height:240px}}
</style></head><body>
<header><h1>🌸 لمسة توفير 🌸</h1><p>أناقتك بأسعار توفر لك</p></header>
<main class="wrap"><div class="promo">✨ تخفيضات حلوة • اختاري اللي يعجبك واطلبي عبر واتساب ✨</div>
<div class="tools"><input id="search" type="search" placeholder="ابحثي عن منتج..." aria-label="ابحثي عن منتج"><select id="category" aria-label="التصنيف"><option value="all">كل المنتجات</option><option value="بيجامات">بيجامات</option><option value="ملابس داخلية">ملابس داخلية</option><option value="ملابس نسائية">ملابس نسائية</option><option value="أخرى">أخرى</option></select></div>
<div id="products" class="grid"><div class="status">جارٍ تحميل المنتجات…</div></div><p class="note">للطلب والاستفسار استخدمي زر واتساب الموجود مع كل منتج.</p><div class="topline"><a class="adminlink" href="/admin/">دخول المالك</a></div></main><footer>لمسة توفير © — تسوّقي براحة وأناقة 💗</footer>
<div class="viewer" id="viewer" role="dialog" aria-label="صورة المنتج" onclick="closeViewer()"><button class="btn" onclick="event.stopPropagation();closeViewer()">إغلاق ✕</button><img id="viewerImg" alt="صورة المنتج الكبيرة"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>
const $=id=>document.getElementById(id);let allProducts=[];const cfg=window.LAMSA_CONFIG||{};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function waNumber(){return String(cfg.WHATSAPP_NUMBER||'').replace(/\D/g,'')}
function orderProduct(id){const p=allProducts.find(x=>String(x.id)===String(id));if(!p)return;const msg='السلام عليكم، أريد طلب: '+p.name+'\nالسعر: '+(p.price||'عند الطلب')+'\nالقسم: '+(p.category||'')+'\nهل المنتج متوفر؟';const n=waNumber();if(!n){alert('رقم واتساب غير مضبوط في config.js');return}window.open('https://wa.me/'+n+'?text='+encodeURIComponent(msg),'_blank','noopener')}
function zoomImage(src){$('viewerImg').src=src;$('viewer').style.display='flex'}function closeViewer(){$('viewer').style.display='none';$('viewerImg').src=''}
function render(){const q=$('search').value.trim().toLocaleLowerCase('ar'),cat=$('category').value;const list=allProducts.filter(p=>(cat==='all'||p.category===cat)&&((p.name||'')+' '+(p.description||'')).toLocaleLowerCase('ar').includes(q));$('products').innerHTML=list.length?list.map(p=>`<article class="card">${p.image_url?`<img class="photo" src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy" onclick="zoomImage(this.src)">`:`<div class="placeholder">🌸</div>`}<div class="content"><h2>${esc(p.name)}</h2><div class="desc">${esc(p.description||'')}</div><div class="price">${esc(p.price||'السعر عند الطلب')}</div><button class="btn" onclick="orderProduct('${esc(p.id)}')">اطلبي الآن عبر واتساب</button></div></article>`).join(''):'<div class="empty">لا توجد منتجات مطابقة حاليًا.</div>'}
async function loadProducts(){if(!window.supabase||!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes('ضع_')||!cfg.SUPABASE_ANON_KEY||cfg.SUPABASE_ANON_KEY.includes('ضع_')){$('products').innerHTML='<div class="status">المتجر جاهز، لكن يلزم ربط قاعدة البيانات في ملف config.js قبل عرض المنتجات المنشورة.</div>';return}try{const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data,error}=await client.from('products').select('id,name,category,price,description,image_url,created_at').eq('active',true).order('created_at',{ascending:false});if(error)throw error;allProducts=data||[];render()}catch(e){console.error(e);$('products').innerHTML='<div class="status">تعذّر تحميل المنتجات الآن. تأكدي من إعدادات قاعدة البيانات وسياساتها، ثم أعيدي تحميل الصفحة.</div>'}}
$('search').addEventListener('input',render);$('category').addEventListener('change',render);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()});loadProducts();
</script></body></html>
